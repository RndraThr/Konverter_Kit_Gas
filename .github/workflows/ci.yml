name: CI

# Pull requests run the fast checks that gate a merge: Go (vet, gofmt, unit and
# integration tests) and the frontend (types, lint, unit tests in shards,
# production build), each only when its side changed. Playwright E2E runs
# after the merge on main (and on demand), so nobody waits for it; a failure
# there is fixed in a follow-up. Caches (node_modules, the built bundle) are
# filled on main and reused by every pull request.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request (or to main) cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── What changed ────────────────────────────────────────
  changes:
    name: What changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Compare with the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          go=false
          frontend=false
          # A CI change runs everything.
          if echo "$files" | grep -q '^\.github/'; then go=true; frontend=true; fi
          # Anything outside frontend/ and docs is the Go side (code, migrations, templates, go.mod).
          if echo "$files" | grep -qvE '^(frontend/|\.github/|docs/)|\.md$'; then go=true; fi
          if echo "$files" | grep -q '^frontend/'; then frontend=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  # ── Backend: Go ─────────────────────────────────────────
  backend:
    name: Go vet, unit & integration tests
    needs: changes
    # The web package's tests serve the built bundle, so a frontend change runs them too.
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: konkit
          POSTGRES_PASSWORD: konkit
          POSTGRES_DB: konkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konkit -d konkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://konkit:konkit@127.0.0.1:5432/konkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # web/static/app is not tracked in git; internal/web tests assert on the built
      # bundle. It is reused from cache while the frontend sources are unchanged.
      - id: bundle
        uses: actions/cache@v4
        with:
          path: web/static/app
          # Keyed on the files the bundle is built from (node_modules excluded).
          key: bundle-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/index.html', 'frontend/package-lock.json', 'frontend/vite.config.ts', 'frontend/tsconfig*.json') }}

      - if: steps.bundle.outputs.cache-hit != 'true'
        uses: ./.github/actions/frontend-deps

      - if: steps.bundle.outputs.cache-hit != 'true'
        name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - if: needs.changes.outputs.go == 'true'
        name: go vet
        run: go vet ./...

      - if: needs.changes.outputs.go == 'true'
        name: Check Go formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files requiring gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go test (unit and integration)
        # -count=1 disables Go's test result cache: integration tests depend on a fresh,
        # empty Postgres service that the cache cannot see. -p 1 because the packages
        # share that one database. A frontend-only change runs just the web package.
        env:
          PACKAGES: ${{ needs.changes.outputs.go == 'true' && './...' || './internal/web/...' }}
        run: go test -p 1 -count=1 $PACKAGES

  # ── Frontend: types, lint, build ────────────────────────
  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/frontend-deps

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint
        # max-warnings matches the current baseline in package.json.
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Check bundle size (warn if JS chunk > 500 kB)
        run: |
          SIZE=$(stat -c%s ../web/static/app/assets/*.js 2>/dev/null | sort -n | tail -1 || echo 0)
          echo "Largest JS chunk: ${SIZE} bytes"
          if [ "$SIZE" -gt 512000 ]; then
            echo "::warning::Bundle JS terbesar ${SIZE} bytes (> 500 kB). Pertimbangkan lazy loading per route."
          fi

  # ── Frontend: unit tests, split in shards that run side by side ──
  frontend-tests:
    name: Frontend unit tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/frontend-deps

      - name: Unit tests
        # One worker per shard, as before (some tests share app-wide singletons).
        run: npm test -- --run --maxWorkers=1 --shard=${{ matrix.shard }}/4

  # ── After the merge: Playwright E2E ─────────────────────
  e2e:
    name: Playwright E2E
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: konkit
          POSTGRES_PASSWORD: konkit
          POSTGRES_DB: konkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konkit -d konkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fills the node_modules cache on main for the pull requests.
      - uses: ./.github/actions/frontend-deps

      - name: Create E2E environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_ADDR=:8082
          APP_BASE_URL=http://127.0.0.1:8082
          DATABASE_URL=postgres://konkit:konkit@127.0.0.1:5432/konkit_test?sslmode=disable
          SESSION_SECRET=konkit-ci-session-secret-at-least-32-bytes
          SESSION_COOKIE_SECURE=false
          STORAGE_BACKEND=local
          STORAGE_PATH=./.cache/e2e-storage
          EOF

      - name: Install Chrome for Playwright
        working-directory: frontend
        run: npm exec playwright install --with-deps chrome

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run e2e

      # The E2E setup builds the bundle; keep it for the pull requests' Go tests.
      - name: Save the built bundle
        if: success()
        uses: actions/cache/save@v4
        with:
          path: web/static/app
          # Keyed on the files the bundle is built from (node_modules excluded).
          key: bundle-${{ hashFiles('frontend/src/**', 'frontend/public/**', 'frontend/index.html', 'frontend/package-lock.json', 'frontend/vite.config.ts', 'frontend/tsconfig*.json') }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
