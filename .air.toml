# Local development auto-reload for the Go server (https://github.com/air-verse/air).
# Started by scripts/dev.ps1 together with the Vite build watcher; see README.
root = "."
tmp_dir = "tmp"

[build]
  # Apply new migrations before every rebuild so schema changes never need a manual step.
  pre_cmd = ["go run ./cmd/migrate up"]
  cmd = "go build -o ./tmp/konkit-server.exe ./cmd/server"
  entrypoint = ["./tmp/konkit-server.exe"]
  include_ext = ["go", "sql", "html"]
  include_dir = ["cmd", "internal", "web/templates"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = true
